[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zmart-drivers"
dynamic = ["version"]
description = "Drivers that connect the ZMART Controller to real microscopes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thom de Hoog", email = "thom.dehoog@zmb.uzh.ch" }]
# A driver works on its own; the ZMART Controller is an extra, for workflows
# that drive the microscope through it (see "controller" below).
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Acquisition",
]

# What a driver needs beyond the controller: pip install -e ".[leica]" or ".[nikon-ar610]".
[project.optional-dependencies]
# The Leica driver: images and their metadata (numpy, tifffile; zarr and
# OME's ome-zarr-models for saving a capture as OME-Zarr 0.5), the setup
# notebooks for orientation and objective calibration (scipy, scikit-image,
# opencv, matplotlib, pillow, ipython), pythonnet, which loads Leica's
# LAS X interface, pywin32, which reads where the z drives are from LAS X's
# hardware server, and comtypes, through which a LAS X warning that asks only
# for OK is answered (Windows UI Automation). LAS X runs on Windows only, so
# these three are installed there.
leica = [
    "numpy>=1.24",
    "tifffile>=2024.1",
    "zarr>=3",
    "ome-zarr-models>=1.7",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
    "pillow>=10",
    "ipython>=8",
    # The setup wizard's window.
    "pywebview>=5",
    "pythonnet>=3; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
]
# The Nikon driver for NIS-Elements AR 6.10: the nis-bridge client (and its fake NIS-Elements, which
# the offline mock builds on), from the bridge's own repository; numpy and
# tifffile to read the pictures NIS-Elements saves; zarr to write a capture
# as OME-Zarr 0.5. The bridge itself runs inside NIS-Elements on Windows,
# from a clone of that repository (the driver's README says how).
nikon-ar610 = [
    "nis-bridge @ git+https://github.com/thomdehoog/nis-useq-aiagent@bridge-hybrid-610#subdirectory=1_nis_bridge",
    "numpy>=1.24",
    "tifffile>=2024.1",
    "zarr>=3",
    "ipython>=8",
]
# The ZMART Controller the driver plugs into. It is not on PyPI, so it is
# installed from its own repository: pip install "zmart-drivers[leica,controller]".
controller = [
    "zmart-controller @ git+https://github.com/ZMB-UZH/ZMART-controller@v0.4.0rc8",
]
# What the offline test suite needs on top of the driver's own extra. It does
# not bring the controller, so the suite also runs as it does where the driver
# is used by itself; add the controller extra for the tests of the driver
# inside the controller: pip install -e ".[leica,controller,test]" or
# ".[nikon-ar610,controller,test]". ome-zarr-models checks a saved store against
# the ZMART metadata convention in both drivers' suites.
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "numpy>=1.24",
    "tifffile>=2024.1",
    "ome-types>=0.5",
    "ome-zarr-models>=1.7",
    "lxml>=4.9",
    "cryptography",
]

[project.urls]
Homepage = "https://github.com/ZMB-UZH/ZMART-drivers"
Controller = "https://github.com/ZMB-UZH/ZMART-controller"

[tool.setuptools.dynamic]
version = { attr = "zmart_drivers.__version__" }

[tool.setuptools.packages.find]
include = ["zmart_drivers*"]
# Only folders with an __init__.py are packages.
namespaces = false
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools]
# Ship only the data files listed below, never whatever else sits in a folder.
include-package-data = false

[tool.setuptools.package-data]
# Data files the driver reads at run time: the bundled default limits,
# orientation and calibration, and the setup notebooks with their import helper.
"*" = [
    "*.json",
    "defaults/*.json",
    "notebooks/*.ipynb",
    "notebooks/bootstrap.py",
    # The setup wizard's built page (plain HTML, CSS and JavaScript).
    "page/index.html",
    "page/assets/*",
]

[tool.ruff.lint.isort]
# The drivers import each other's parts by their full names, zmart_drivers.<...>;
# sort those as this project's own imports wherever ruff is started from.
known-first-party = ["zmart_drivers"]
