# The Nikon NIS-Elements AR 7 driver: how pytest runs its offline suite.
#
# Run `pytest` in this folder, or `python run_ci.py`, which adds coverage and
# reports. Every test runs against the pretend NIS (helpers/mock_nis.py) and
# the real bridge, so no microscope is needed. The checks at a real microscope
# are in hardware/, and pytest does not collect them.
[pytest]
testpaths = unit

# -ra               a summary of everything but the passes, so nothing is silent
# --strict-markers  an unregistered marker is an error, not a quiet typo
# --strict-config   a typo in this file is an error
# --durations=10    the ten slowest tests, so slow ones are seen
addopts =
    -ra
    --strict-markers
    --strict-config
    --durations=10

markers =
    controller: checks the driver inside the ZMART Controller; skipped when the controller is not installed.
