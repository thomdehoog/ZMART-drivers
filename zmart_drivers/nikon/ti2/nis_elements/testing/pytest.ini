# The Nikon NIS-Elements driver -- pytest configuration.
#
# `pytest` run from this folder discovers the driver's offline suite with
# strict defaults; run_ci.py layers coverage and report paths on top.
[pytest]
testpaths = .

addopts =
    -ra
    --strict-markers
    --strict-config
    --durations=10

markers =
    hardware: needs NIS-Elements with the bridge running (simulator or microscope); not collected offline.
    controller: checks the driver inside the ZMART Controller; skipped when the controller is not installed.
