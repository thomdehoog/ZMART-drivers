# The ZEISS driver's pytest settings.
#
# `pytest` run from this folder finds the whole offline suite (unit/ and
# hardware/test_*.py, which run the check at the microscope against the
# stand-in). run_ci.py adds coverage and the report paths on top.
[pytest]
testpaths = .

# -ra               a summary of everything but the passes, so nothing is silent
# --strict-markers  an unregistered marker is an error, not a typo that selects nothing
# --strict-config   a typo in this file is an error
# --durations=20    the twenty slowest tests, for timing
addopts =
    -ra
    --strict-markers
    --strict-config
    --durations=20

markers =
    hardware: needs a real ZEN; no test has it today, the check at the microscope is a script (testing/hardware/check_on_zen.py).
    controller: checks the driver inside the ZMART Controller; skipped when the controller is not installed. run_ci.py runs these as the controller layer.
