# FV4000 RDK driver -- pytest configuration.
#
# `pytest` run from this folder discovers the driver's offline suite with
# strict defaults; run_ci.py adds coverage and the report paths on top.
[pytest]
testpaths = .
addopts =
    -ra
    --strict-markers
    --strict-config
    --durations=20
markers =
    hardware: needs a live FLUOVIEW (not collected offline)
    controller: checks the driver inside the ZMART Controller; skipped when the controller is not installed
