# The driver's offline test suite, on Linux and Windows, Python 3.11 and 3.12.
#
# This file is intentionally thin. What the suite runs is defined beside the
# driver itself (its run_ci.py and pytest.ini); this workflow only installs the
# repository with the driver's extras and starts the suite. Installing the
# repository also installs the ZMART Controller, from its own repository
# (ZMB-UZH/ZMART-controller), because the driver plugs into it.
#
# The suite needs no microscope and no vendor software.
name: drivers-offline

on:
  push:
    branches: [main, release-candidate]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  offline:
    name: ${{ matrix.driver }} (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg # headless matplotlib for the Leica calibration plot tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        driver: [leica]
        include:
          - driver: leica
            extras: leica,test
            run: python zmart_drivers/leica/stellaris5_y42h93/navigator_expert/testing/run_ci.py
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the environment header records the real git revision

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the drivers, the ZMART Controller and the test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"

      - name: Run the offline suite
        run: ${{ matrix.run }}

      - name: Upload reports
        if: always() # keep reports even when tests fail -- that's when they matter most
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.driver }}-${{ matrix.os }}-py${{ matrix.python-version }}
          path: zmart_drivers/**/testing/report/
          if-no-files-found: ignore
