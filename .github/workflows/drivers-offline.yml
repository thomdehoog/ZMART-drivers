# The drivers' offline test suites, on Linux and Windows, Python 3.11 and 3.12.
#
# This file is intentionally thin. What the suite runs is defined beside the
# driver itself (its run_ci.py and pytest.ini); this workflow only installs the
# repository with the driver's extras and starts the suite.
#
# Two kinds of job, because the driver is also used by itself:
#   - with the ZMART Controller (installed from ZMB-UZH/ZMART-controller):
#     both layers, and --controller makes sure the controller layer ran;
#   - "alone": the driver without the controller, so a dependency on the
#     controller that slips into the driver is caught. Its controller layer
#     shows as SKIP.
#
# The suite needs no microscope and no vendor software.
name: drivers-offline

on:
  push:
    branches: [main, release-candidate]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  offline:
    name: ${{ matrix.driver }}${{ matrix.install == 'alone' && ' alone' || '' }} (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg # headless matplotlib for the Leica calibration plot tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        driver: [leica, nikon-ar610]
        # An entry below with another install value cannot merge into these
        # jobs, so GitHub adds it as a job of its own.
        install: [with-controller]
        include:
          - driver: leica
            install: with-controller
            extras: leica,controller,test
            run: python zmart_drivers/leica/stellaris/navigator_expert/testing/run_ci.py --controller
          - driver: nikon-ar610
            install: with-controller
            extras: nikon-ar610,controller,test
            run: python zmart_drivers/nikon/nis_elements_ar610/testing/run_ci.py --controller
          # Each driver by itself, without the controller, once per system.
          - driver: leica
            install: alone
            os: ubuntu-latest
            python-version: "3.12"
            extras: leica,test
            run: python zmart_drivers/leica/stellaris/navigator_expert/testing/run_ci.py
          - driver: leica
            install: alone
            os: windows-latest
            python-version: "3.12"
            extras: leica,test
            run: python zmart_drivers/leica/stellaris/navigator_expert/testing/run_ci.py
          - driver: nikon-ar610
            install: alone
            os: ubuntu-latest
            python-version: "3.12"
            extras: nikon-ar610,test
            run: python zmart_drivers/nikon/nis_elements_ar610/testing/run_ci.py
          - driver: nikon-ar610
            install: alone
            os: windows-latest
            python-version: "3.12"
            extras: nikon-ar610,test
            run: python zmart_drivers/nikon/nis_elements_ar610/testing/run_ci.py
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the environment header records the real git revision

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the drivers, the test dependencies and (unless alone) the ZMART Controller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"

      - name: Run the offline suite
        run: ${{ matrix.run }}

      - name: Upload reports
        if: always() # keep reports even when tests fail -- that's when they matter most
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.driver }}${{ matrix.install == 'alone' && '-alone' || '' }}-${{ matrix.os }}-py${{ matrix.python-version }}
          path: zmart_drivers/**/testing/report/
          if-no-files-found: ignore
